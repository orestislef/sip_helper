name: sip_helper
description: >-
  SIP/VoIP for Flutter. SIP over UDP, RTP, G.711 A-law and u-law, hold and
  resume, blind transfer and DTMF, with native call audio on Android, iOS and
  Windows.
version: 0.4.0
homepage: https://orestislef.gr/
repository: https://github.com/orestislef/sip_helper
issue_tracker: https://github.com/orestislef/sip_helper/issues
topics:
  - sip
  - voip
  - rtp
  - audio
  - telephony

environment:
  sdk: ^3.4.0
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  ffi: ^2.2.0
  crypto: ^3.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  lints: ^6.1.0

flutter:
  plugin:
    platforms:
      android:
        package: gr.orestislef.sip_helper
        pluginClass: SipHelperPlugin
      ios:
        pluginClass: SipHelperPlugin
      windows:
        dartPluginClass: SipHelperWindows
